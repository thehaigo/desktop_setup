plugins {
    alias(libs.plugins.android.application)
}

def erlangLibsDir = new File(project.rootDir, "erlang-libs")

android {
    namespace 'com.example.template_app'
    compileSdk 36

    tasks.register("buildElixirRelease", Exec) {
        workingDir project.projectDir

        commandLine "/bin/bash", "$projectDir/run_mix"
        def home = System.getProperty("user.home")
        environment "PATH", [
                "/opt/homebrew/bin",
                "/usr/local/bin",
                "${home}/.local/bin",
                "${home}/.local/share/mise/shims",
                System.getenv("PATH")
        ].join(":")
        environment "MIX_ENV", "prod"
        environment "MIX_TARGET", "android"
    }

    // Extract ELF binaries from runtime zips into jniLibs so Android
    // packages them in the native library directory (which is executable).
    // Bridge.kt creates symlinks from bin/<name> -> nativeDir/lib__<name>.so
    tasks.register("extractRuntimeBinaries") {
        def assetsDir = file("src/main/assets")
        def jniLibsDir = file("src/main/jniLibs")
        def abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
        def elfBinaries = ["inet_gethost", "erl_child_setup", "heart", "epmd", "erlexec"]

        inputs.dir(assetsDir)
        outputs.dir(jniLibsDir)

        doLast {
            abis.each { abi ->
                def zipFile = new File(assetsDir, "${abi}-runtime.zip")
                if (!zipFile.exists()) return

                def outDir = new File(jniLibsDir, abi)
                outDir.mkdirs()

                def zis = new java.util.zip.ZipInputStream(
                    new java.io.BufferedInputStream(new java.io.FileInputStream(zipFile))
                )
                def entry
                while ((entry = zis.nextEntry) != null) {
                    def name = new File(entry.name).name
                    if (elfBinaries.contains(name)) {
                        def dest = new File(outDir, "lib__${name}.so")
                        dest.withOutputStream { os ->
                            def buf = new byte[8192]
                            int len
                            while ((len = zis.read(buf)) != -1) {
                                os.write(buf, 0, len)
                            }
                        }
                    }
                    zis.closeEntry()
                }
                zis.close()
            }
        }
    }

    plugins.withId("com.android.application") {
        tasks.named("preBuild").configure {
            dependsOn(tasks.named("buildElixirRelease"))
            dependsOn(tasks.named("extractRuntimeBinaries"))
        }
    }

    defaultConfig {
        applicationId "com.example.template_app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a" , "x86_64"
             stl "c++_shared"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
            buildStagingDirectory "$projectDir/.cxx"
        }
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: '*.jar')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
